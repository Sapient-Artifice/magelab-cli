name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Sapient-Artifice/magelab
          ref: main
      - name: Overlay CLI source
        uses: actions/checkout@v4
        with:
          path: magelab-cli
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p magelab-cli

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Sapient-Artifice/magelab
          ref: main
      - name: Overlay CLI source
        uses: actions/checkout@v4
        with:
          path: magelab-cli
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p magelab-cli

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Sapient-Artifice/magelab
          ref: main
      - name: Overlay CLI source
        uses: actions/checkout@v4
        with:
          path: magelab-cli
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p magelab-cli -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Sapient-Artifice/magelab
          ref: main
      - name: Overlay CLI source
        uses: actions/checkout@v4
        with:
          path: magelab-cli
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt -p magelab-cli --check
