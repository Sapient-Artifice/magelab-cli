name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
            name: mage-macos-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            name: mage-macos-aarch64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            name: mage-linux-x86_64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            name: mage-linux-aarch64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            name: mage-windows-x86_64.exe

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          repository: Sapient-Artifice/magelab
          ref: main
          token: ${{ secrets.MAGELAB_READ_TOKEN }}
      - name: Overlay CLI source
        uses: actions/checkout@v6
        with:
          path: magelab-cli

      - name: Use Rustls for release TLS
        shell: pwsh
        run: |
          $path = "Cargo.toml"
          $content = Get-Content $path -Raw
          $content = $content -replace 'reqwest = \{ version = "0\.12", features = \["json", "stream", "native-tls"\] \}', 'reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }'
          if ($content -notmatch 'reqwest = \{ version = "0\.12", default-features = false, features = \["json", "stream", "rustls-tls"\] \}') {
            throw "Failed to switch workspace reqwest dependency to Rustls"
          }
          Set-Content -Path $path -Value $content -NoNewline

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} -p magelab-cli

      - name: Rename binary (Unix)
        if: runner.os != 'Windows'
        run: cp target/${{ matrix.target }}/release/mage ${{ matrix.name }}

      - name: Rename binary (Windows)
        if: runner.os == 'Windows'
        run: cp target/${{ matrix.target }}/release/mage.exe ${{ matrix.name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}

  macos-universal:
    needs: build
    runs-on: macos-latest
    steps:
      - name: Download x86_64
        uses: actions/download-artifact@v4
        with:
          name: mage-macos-x86_64
      - name: Download aarch64
        uses: actions/download-artifact@v4
        with:
          name: mage-macos-aarch64

      - name: Create universal binary
        run: |
          chmod +x mage-macos-x86_64 mage-macos-aarch64
          lipo -create -output mage-macos-universal mage-macos-x86_64 mage-macos-aarch64
          chmod +x mage-macos-universal

      - name: Upload universal binary
        uses: actions/upload-artifact@v4
        with:
          name: mage-macos-universal
          path: mage-macos-universal

  release:
    needs: [build, macos-universal]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create checksums
        run: |
          cd artifacts
          for dir in */; do
            for file in "$dir"*; do
              sha256sum "$file" >> checksums.txt
            done
          done
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/mage-macos-universal/mage-macos-universal
            artifacts/mage-macos-x86_64/mage-macos-x86_64
            artifacts/mage-macos-aarch64/mage-macos-aarch64
            artifacts/mage-linux-x86_64/mage-linux-x86_64
            artifacts/mage-linux-aarch64/mage-linux-aarch64
            artifacts/mage-windows-x86_64.exe/mage-windows-x86_64.exe
            artifacts/checksums.txt
