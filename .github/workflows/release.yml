name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      release_tag: ${{ github.ref_name }}
    secrets: inherit

  release:
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create checksums for the complete artifact set
        shell: bash
        run: |
          mkdir release
          for asset in mage-macos-universal mage-macos-x86_64 mage-macos-aarch64 mage-linux-x86_64 mage-linux-aarch64 mage-windows-x86_64.exe; do
            test -s "artifacts/$asset/$asset"
            cp "artifacts/$asset/$asset" "release/$asset"
          done
          cd release
          sha256sum mage-* > checksums.txt
          sha256sum --check checksums.txt

      - name: Refuse to overwrite an already published release
        shell: bash
        run: |
          if state=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$state" != true ]; then
              echo "Release $RELEASE_TAG is already published; choose a new version." >&2
              exit 1
            fi
          fi

      - name: Upload all verified assets to a draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/mage-macos-universal
            release/mage-macos-x86_64
            release/mage-macos-aarch64
            release/mage-linux-x86_64
            release/mage-linux-aarch64
            release/mage-windows-x86_64.exe
            release/checksums.txt

      - name: Publish the complete release
        run: gh release edit "$RELEASE_TAG" --draft=false
