[package]
name = "magelab-cli"
version = "0.1.0"
edition = "2021"
description = "MageLab CLI — infrastructure management for MageLab backends and accounts"
license = "MIT"
repository = "https://github.com/Sapient-Artifice/magelab-cli"
readme = "README.md"
keywords = ["ai", "cli", "llm", "chat"]
categories = ["command-line-utilities"]

[[bin]]
name = "mage"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
reqwest = { version = "0.12", features = ["json", "stream", "native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "6"
anyhow = "1"
url = "2"
open = "5"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
keyring = { version = "3", features = ["apple-native", "linux-native", "windows-native"] }
urlencoding = "2.1.3"
crossterm = "0.28"
indicatif = "0.17"
clap_complete = "4.6.2"
futures-util = "0.3"
iota_stronghold = "2"
argon2 = { package = "rust-argon2", version = "2" }
zeroize = "1"
thiserror = "2"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework-sys = "2"
core-foundation = "0.10"
core-foundation-sys = "0.8"
objc2 = "0.6"
objc2-local-authentication = "0.3"
objc2-foundation = "0.3"
block2 = "0.6"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
tokio-test = "0.4"
wiremock = "0.6"
serde_json = "1"
serial_test = "3"
