[package]
name = "magelab-cli"
version = "0.1.0"
edition = "2021"
description = "MageLab CLI — infrastructure management for MageLab backends and accounts"
license = "MIT"
repository = "https://github.com/Sapient-Artifice/magelab-cli"
readme = "README.md"
keywords = ["ai", "cli", "llm", "chat"]
categories = ["command-line-utilities"]

[[bin]]
name = "mage"
path = "src/main.rs"

[dependencies]
magelab-core = { path = "../crates/magelab-core" }
clap = { version = "4", features = ["derive"] }
tokio.workspace = true
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
dirs.workspace = true
anyhow.workspace = true
url = "2"
open = "5"
urlencoding = "2.1.3"
crossterm = "0.28"
indicatif = "0.17"
clap_complete = "4.6.2"
futures-util = "0.3"
posthog-rs = "0.7"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework-sys = "2"
core-foundation = "0.10"
core-foundation-sys = "0.8"
objc2 = "0.6"
objc2-local-authentication = "0.3"
objc2-foundation = "0.3"
block2 = "0.6"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
tokio-test = "0.4"
wiremock = "0.6"
serde_json.workspace = true
serial_test = "3"
